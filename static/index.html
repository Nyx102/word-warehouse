<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>WorldEnd Translation Workbench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="sidebar-head">
      <span class="brand">WorldEnd</span>
      <button id="new-thread-btn" class="btn-sm" title="New chat thread">+ New</button>
    </div>
    <ul id="thread-list"></ul>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
      <nav id="tabs">
        <button class="tab-btn active" data-tab="chat">Chat</button>
        <button class="tab-btn" data-tab="search">Search</button>
        <button class="tab-btn" data-tab="flags">Flags</button>
        <button class="tab-btn" data-tab="diffs">Diffs</button>
      </nav>
      <div id="statusbar">
        <span id="st-spinner" class="spinner hidden" title="A chat turn is running"></span>
        <span id="st-index" class="st-item">&mdash;</span>
        <span id="st-fresh" class="st-item dim"></span>
        <button id="st-corpus" class="dirty-badge hidden" title="Dirty files in corpus (raws, notes)"></button>
        <button id="st-repo" class="dirty-badge hidden" title="Dirty files in translation repo"></button>
      </div>
    </header>

    <main id="panels">

      <!-- CHAT -->
      <section id="tab-chat" class="panel active">
        <div id="chat-scroll">
          <div id="chat-messages"></div>
          <button id="jump-latest" class="hidden">&darr; Jump to latest</button>
        </div>
        <div id="composer">
          <textarea id="chat-input" rows="2"
            placeholder="Message&hellip;  (Enter to send, Shift+Enter for newline)"></textarea>
          <div class="composer-btns">
            <button id="stop-btn" class="hidden">Stop</button>
            <button id="send-btn" class="primary">Send</button>
          </div>
        </div>
      </section>

      <!-- SEARCH -->
      <section id="tab-search" class="panel">
        <div class="search-bar">
          <input id="search-q" type="text" placeholder="Search corpus&hellip;  ( / )" autocomplete="off">
          <select id="f-lang" title="Language">
            <option value="any">lang: any</option>
            <option value="en">en</option>
            <option value="jp">jp</option>
            <option value="zh">zh</option>
            <option value="zh-s">zh-s</option>
            <option value="zh-t">zh-t</option>
          </select>
          <select id="f-series" title="Series">
            <option value="any">series: any</option>
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
          <select id="f-source" title="Source">
            <option value="any">source: any</option>
            <option value="official">official</option>
            <option value="fan">fan</option>
            <option value="jp">jp</option>
            <option value="zh">zh</option>
            <option value="raw">raw</option>
            <option value="notes">notes</option>
            <option value="docs">docs</option>
          </select>
          <select id="f-kind" title="Chunk kind">
            <option value="body">kind: body</option>
            <option value="all">kind: all</option>
          </select>
          <input id="f-limit" type="number" min="1" max="500" value="30" title="Max results">
          <button id="search-btn" class="primary">Search</button>
        </div>
        <div id="search-results"></div>
        <details class="align-panel">
          <summary>Alignment</summary>
          <div class="align-controls">
            <select id="al-series">
              <option value="any">series: any</option>
              <option value="1">1</option>
              <option value="2">2</option>
            </select>
            <input id="al-volume" type="text" placeholder="volume (blank = all)" size="16">
            <button id="al-load">Load alignment</button>
          </div>
          <div id="align-results"></div>
        </details>
      </section>

      <!-- FLAGS -->
      <section id="tab-flags" class="panel">
        <div class="flags-toolbar">
          <span id="flags-total"></span>
          <button id="lint-rerun">Re-run lint</button>
          <label class="check-label">
            <input id="flags-show-dismissed" type="checkbox"> show dismissed
          </label>
          <span id="flags-generated" class="dim"></span>
        </div>
        <div id="flags-list"></div>
      </section>

      <!-- DIFFS -->
      <section id="tab-diffs" class="panel">
        <div class="diffs-toolbar">
          <div class="seg">
            <button id="repo-corpus" class="seg-btn active">Corpus</button>
            <button id="repo-repo" class="seg-btn">Translation repo</button>
          </div>
          <button id="coverage-btn">Coverage</button>
        </div>
        <div class="diffs-body">
          <div class="diffs-left">
            <div id="diff-files"></div>
            <div class="commit-box">
              <input id="commit-msg" type="text" placeholder="Commit message&hellip;" autocomplete="off">
              <button id="commit-btn" class="primary">Commit</button>
            </div>
            <h3 class="side-h">Recent commits</h3>
            <div id="git-log"></div>
          </div>
          <div id="diff-view" class="mono"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-head">
      <span id="modal-title" class="mono"></span>
      <button id="modal-close" title="Close (Esc)">&times;</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-foot"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>

services:
  workbench:
    build: .
    container_name: word-warehouse
    restart: unless-stopped
    ports:
      - "8686:8686"
      - "5173:5173"
    volumes:
      - .:/word-warehouse
      - ~/.claude:/root/.claude
      - ~/.gitconfig:/root/.gitconfig:ro
    mem_limit: 3g
    environment:
      - WORKBENCH_CLAUDE_BIN=claude
